<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Apex Bank{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    :root {
      --blue-800: #1E40AF;
      --blue-700: #1D4ED8;
      --blue-600: #2563EB;
      --blue-50:  #EFF6FF;
      --green:    #10B981;
      --red:      #EF4444;
      --slate-900: #0F172A;
      --slate-700: #334155;
      --slate-500: #64748B;
      --slate-300: #CBD5E1;
      --slate-100: #F1F5F9;
      --slate-50:  #F8FAFC;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--slate-100);
      color: var(--slate-900);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    main { flex: 1; }

    /* Auth layout */
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
    }
    .auth-panel-left {
      width: 480px;
      flex-shrink: 0;
      background: linear-gradient(145deg, #1E3A8A 0%, #1E40AF 40%, #2563EB 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2.5rem;
      position: relative;
      overflow: hidden;
    }
    @media (max-width: 900px) { .auth-panel-left { display: none; } }
    .auth-panel-right {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: var(--slate-50);
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 1.25rem;
      box-shadow: 0 4px 24px rgba(15,18,40,0.10);
      padding: 2.5rem;
    }
    @media (max-width: 480px) {
      .auth-card { padding: 1.75rem 1.25rem; border-radius: 1rem; }
    }

    /* Brand mark */
    .brand-mark {
      width: 44px; height: 44px;
      background: rgba(255,255,255,0.15);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; font-weight: 800; color: #fff;
    }
    .brand-mark-blue {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, var(--blue-800), var(--blue-600));
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; font-weight: 800; color: #fff;
    }

    /* Left panel decorations */
    .panel-circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
    }

    /* Form controls */
    .form-control {
      border: 1.5px solid #E2E8F0;
      border-radius: 0.6rem;
      padding: 0.65rem 0.9rem;
      font-size: 0.9rem;
      transition: border-color .15s, box-shadow .15s;
    }
    .form-control:focus {
      border-color: var(--blue-600);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
      outline: none;
    }
    .form-label { font-weight: 600; font-size: 0.82rem; color: var(--slate-700); margin-bottom: 0.4rem; }

    /* Buttons */
    .btn-primary-apex {
      background: var(--blue-800);
      color: #fff;
      border: none;
      border-radius: 0.65rem;
      font-weight: 600;
      padding: 0.7rem 1.5rem;
      font-size: 0.92rem;
      width: 100%;
      transition: background .15s, transform .1s, box-shadow .15s;
      cursor: pointer;
    }
    .btn-primary-apex:hover {
      background: var(--blue-700);
      box-shadow: 0 4px 12px rgba(30,64,175,0.3);
      transform: translateY(-1px);
      color: #fff;
    }
    .btn-primary-apex:active { transform: translateY(0); }

    /* Alerts */
    .apex-alert-danger {
      background: #FEF2F2; border: 1px solid #FECACA;
      color: #991B1B; border-radius: 0.6rem;
      padding: 0.65rem 0.9rem; font-size: 0.85rem;
    }

    {% block extra_styles %}{% endblock %}
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% if messages %}
    <div style="position:fixed;top:1rem;right:1rem;z-index:9999;width:320px;">
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show shadow-sm rounded-3 mb-2" style="font-size:0.875rem;">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    </div>
  {% endif %}
  <main>{% block content %}{% endblock %}</main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
