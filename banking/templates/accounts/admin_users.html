{% extends "base_app.html" %}

{% block content %}

<h1>All Users</h1>

<table>
    <thead>
        <tr>
            <th>Name</th>
            <th>Email</th>
        </tr>
    </thead>

    <tbody>

    {% for user in users %}

        <tr>
            <td>{{ user.get_full_name }}</td>
            <td>{{ user.email }}</td>
        </tr>

    {% endfor %}

    </tbody>

</table>

{% endblock %}
