{% extends "base_app.html" %}

{% block content %}

<h1>All Accounts</h1>

<table>
    <thead>
        <tr>
            <th>Account Number</th>
            <th>Owner</th>
            <th>Balance</th>
        </tr>
    </thead>

    <tbody>

    {% for account in accounts %}

        <tr>
            <td>{{ account.account_number }}</td>
            <td>{{ account.owner.get_full_name }}</td>
            <td>{{ account.balance }}</td>
        </tr>

    {% endfor %}

    </tbody>

</table>

{% endblock %}
